<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0c10">
<title>⚡ BELGITUDE™ WAR ROOM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&family=Fredoka:wght@400;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0c10;--surface:#12131a;--border:#1a1c24;--fg:#c5c6c7;
  --amber:#ffbf00;--amber-dim:#3d2e00;--amber-glow:rgba(255,191,0,.12);
  --red:#fc3d39;--green:#45a049;--cyan:#66fcf1;--pink:#FF6B9D;--purple:#A78BFA;
  --blue:#45B7D1;--orange:#F4845F;
  --display:'Orbitron',sans-serif;--mono:'JetBrains Mono',monospace;--body:'Fredoka',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --nav-h:72px;--header-h:56px;
}
html,body{
  height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:var(--body);touch-action:pan-y;
}

/* ═══ HEADER ═══ */
.header{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);z-index:100;
  background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 1rem;gap:.8rem;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.header .logo{
  font:900 .85rem var(--display);color:var(--amber);letter-spacing:.08em;
  text-shadow:0 0 12px var(--amber-glow);flex-shrink:0;
}
.header .page-title{
  font:600 .7rem var(--display);color:var(--fg);letter-spacing:.1em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:right;
  opacity:.6;text-transform:uppercase;
}
.header .radar-dot{
  width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;
  box-shadow:0 0 6px var(--green);animation:pulse-dot 2s infinite;
}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}

/* ═══ MAIN VIEWPORT ═══ */
.viewport{
  position:fixed;
  top:var(--header-h);left:0;right:0;
  bottom:calc(var(--nav-h) + var(--safe-b));
  overflow:hidden;
}

/* ═══ SWIPE TRACK ═══ */
.track{
  display:flex;height:100%;
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
.track.dragging{transition:none}
.track .page{
  flex:0 0 100%;width:100%;height:100%;position:relative;overflow:hidden;
}
.track .page iframe{
  width:100%;height:100%;border:none;background:var(--bg);
}

/* ═══ PAGE LOADING ═══ */
.page-loader{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:var(--bg);z-index:2;
  transition:opacity .3s;
}
.page-loader.hidden{opacity:0;pointer-events:none}
.loader-ring{
  width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--amber);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font:.6rem var(--display);color:var(--amber);letter-spacing:.2em;margin-top:.8rem;opacity:.5}

/* ═══ BOTTOM NAV ═══ */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:var(--surface);border-top:1px solid var(--border);
  padding-bottom:var(--safe-b);
  display:flex;align-items:stretch;height:calc(var(--nav-h) + var(--safe-b));
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}

.nav-item{
  flex:0 0 auto;min-width:72px;padding:.5rem .6rem;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.2rem;cursor:pointer;position:relative;
  transition:all .2s;user-select:none;border:none;background:none;color:var(--fg);
}
.nav-item .icon{
  width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:.9rem;transition:all .2s;background:transparent;
}
.nav-item .label{
  font:600 .5rem var(--display);letter-spacing:.05em;text-transform:uppercase;
  white-space:nowrap;opacity:.5;transition:all .2s;
}
.nav-item.active .icon{
  background:var(--amber);color:var(--bg);box-shadow:0 0 12px var(--amber-glow);
  transform:scale(1.1);
}
.nav-item.active .label{color:var(--amber);opacity:1}
.nav-item:not(.active):active .icon{transform:scale(.9)}

/* indicator line */
.nav-indicator{
  position:absolute;top:0;height:2px;background:var(--amber);
  transition:left .3s cubic-bezier(.4,0,.2,1),width .3s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 8px var(--amber-glow);
}

/* ═══ SWIPE HINT ═══ */
.swipe-hint{
  position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);
  left:50%;transform:translateX(-50%);z-index:50;
  background:var(--surface);border:1px solid var(--border);border-radius:2rem;
  padding:.4rem 1rem;font:.6rem var(--mono);color:var(--amber);
  opacity:0;transition:opacity .5s;pointer-events:none;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}
.swipe-hint.show{opacity:1}
.swipe-hint .arrow{display:inline-block;animation:swipe-anim 1.5s ease-in-out infinite}
@keyframes swipe-anim{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}

/* ═══ PAGE COUNTER ═══ */
.page-dots{
  position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 8px);
  left:50%;transform:translateX(-50%);z-index:50;
  display:flex;gap:6px;padding:.3rem .6rem;
  background:rgba(11,12,16,.8);border-radius:1rem;
  backdrop-filter:blur(8px);
}
.page-dots .dot{
  width:6px;height:6px;border-radius:50%;background:var(--border);
  transition:all .3s;
}
.page-dots .dot.active{background:var(--amber);box-shadow:0 0 6px var(--amber-glow);width:18px;border-radius:3px}

/* ═══ DRAWER ═══ */
.drawer-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;right:-320px;top:0;bottom:0;width:300px;max-width:85vw;z-index:201;
  background:var(--surface);border-left:1px solid var(--border);
  transition:right .35s cubic-bezier(.4,0,.2,1);
  padding:1.5rem;overflow-y:auto;
}
.drawer-overlay.open .drawer{right:0}
.drawer h3{
  font:700 .65rem var(--display);color:var(--amber);letter-spacing:.2em;
  margin-bottom:1rem;text-transform:uppercase;
}
.drawer-item{
  display:flex;align-items:center;gap:.8rem;padding:.8rem;
  border:1px solid var(--border);border-radius:.6rem;margin-bottom:.5rem;
  cursor:pointer;transition:all .2s;background:var(--bg);
}
.drawer-item:hover,.drawer-item.active{border-color:var(--amber);background:rgba(255,191,0,.05)}
.drawer-item .d-icon{
  width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;flex-shrink:0;
}
.drawer-item .d-info{flex:1;min-width:0}
.drawer-item .d-name{font:600 .75rem var(--body);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-item .d-desc{font:.6rem var(--mono);color:#555;margin-top:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-close{
  position:absolute;top:1rem;right:1rem;background:none;border:1px solid var(--border);
  color:var(--fg);width:32px;height:32px;border-radius:50%;cursor:pointer;
  font:700 1rem var(--body);display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.drawer-close:hover{border-color:var(--red);color:var(--red)}

/* ═══ RESPONSIVE ═══ */
@media(min-width:768px){
  .nav-item{min-width:90px;padding:.5rem 1rem}
  .nav-item .label{font-size:.55rem}
}
@media(min-width:1024px){
  :root{--nav-h:64px;--header-h:48px}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <span class="radar-dot"></span>
  <span class="logo">BELGITUDE™</span>
  <span class="page-title" id="pageTitle">WAR ROOM</span>
  <button onclick="toggleDrawer()" style="background:none;border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:4px 8px;cursor:pointer;font:.6rem var(--display);letter-spacing:.1em">☰</button>
</div>

<!-- VIEWPORT -->
<div class="viewport">
  <div class="track" id="track"></div>
</div>

<!-- PAGE DOTS -->
<div class="page-dots" id="pageDots"></div>

<!-- SWIPE HINT -->
<div class="swipe-hint" id="swipeHint"><span class="arrow">→</span> SWIPE POUR NAVIGUER</div>

<!-- BOTTOM NAV -->
<nav class="nav" id="nav">
  <div class="nav-indicator" id="navIndicator"></div>
</nav>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()">
  <div class="drawer" onclick="event.stopPropagation()">
    <button class="drawer-close" onclick="toggleDrawer()">✕</button>
    <h3>Dossiers</h3>
    <div id="drawerList"></div>
    <div style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border)">
      <h3>Infrastructure</h3>
      <div style="font:.65rem var(--mono);color:#555;line-height:1.8">
        Budget : 29€/mois<br>
        Tracking : zéro<br>
        Licence : CC BY-NC-SA 4.0<br>
        Doctrine : Fork · Hack · Spread<br>
        Co-création : Yan & Claude<br>
        <span style="color:var(--amber)">ouaisfieu</span> · intelligence citoyenne
      </div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════
// PAGE REGISTRY — ajoutez vos pages ici
// ══════════════════════════════════════
const PAGES = [
  {
    id: 'system',
    icon: '⚙️',
    label: 'Système',
    title: 'BELGITUDE™ — Le Système',
    file: 'belgitude-fanclub.html',
    color: '#48bb78',
    desc: 'CRT brutalist · diagnostic particratie'
  },
  {
    id: 'scandales',
    icon: '💣',
    label: 'Scandales',
    title: 'Ligne Claire — Les Scandales',
    file: 'belgitude-ligne-claire.html',
    color: '#D7263D',
    desc: 'Tintin · affaire Deborsu · Quintin'
  },
  {
    id: 'exclus',
    icon: '👁️',
    label: 'Exclus',
    title: 'WAKE UP — Les Exclus',
    file: 'belgitude-matrix-exclus.html',
    color: '#00ff41',
    desc: 'Matrix · 900K · 10K sans-abri · 44%'
  },
  {
    id: 'warroom',
    icon: '⚔️',
    label: 'Stratégie',
    title: 'WAR ROOM — Trois Guerres',
    file: 'belgitude-warroom.html',
    color: '#ffbf00',
    desc: 'Ops tactique · arsenal juridique'
  },
  {
    id: 'guide',
    icon: '🎮',
    label: 'Guide',
    title: 'Résistance Citoyenne — Le Guide',
    file: 'belgitude-cartoon-guide.html',
    color: '#FF6B9D',
    desc: 'Cartoon · accessible · mode action'
  }
  // ─── AJOUTEZ VOS PAGES ICI ───
  // {
  //   id: 'nouveau',
  //   icon: '🆕',
  //   label: 'Nouveau',
  //   title: 'Titre complet',
  //   file: 'nom-du-fichier.html',
  //   color: '#A78BFA',
  //   desc: 'Description courte'
  // }
];

// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
let currentIndex = 0;
let startX = 0;
let currentX = 0;
let isDragging = false;
let hasSwiped = false;

const track = document.getElementById('track');
const nav = document.getElementById('nav');
const pageDots = document.getElementById('pageDots');
const pageTitle = document.getElementById('pageTitle');
const navIndicator = document.getElementById('navIndicator');
const swipeHint = document.getElementById('swipeHint');
const drawerList = document.getElementById('drawerList');

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
function init() {
  // Build pages
  PAGES.forEach((p, i) => {
    // Track page
    const page = document.createElement('div');
    page.className = 'page';
    page.innerHTML = `
      <div class="page-loader" id="loader-${i}">
        <div class="loader-ring"></div>
        <div class="loader-text">CHARGEMENT</div>
      </div>
    `;
    track.appendChild(page);

    // Nav item
    const ni = document.createElement('button');
    ni.className = 'nav-item' + (i === 0 ? ' active' : '');
    ni.innerHTML = `<div class="icon" style="${i===currentIndex?'background:var(--amber);color:var(--bg)':''}">${p.icon}</div><div class="label">${p.label}</div>`;
    ni.addEventListener('click', () => goTo(i));
    nav.appendChild(ni);

    // Dot
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    pageDots.appendChild(dot);

    // Drawer item
    const di = document.createElement('div');
    di.className = 'drawer-item' + (i === 0 ? ' active' : '');
    di.innerHTML = `
      <div class="d-icon" style="background:${p.color}20;color:${p.color}">${p.icon}</div>
      <div class="d-info">
        <div class="d-name">${p.title}</div>
        <div class="d-desc">${p.desc}</div>
      </div>
    `;
    di.addEventListener('click', () => { goTo(i); toggleDrawer(); });
    drawerList.appendChild(di);
  });

  // Load first page immediately, others lazily
  loadPage(0);
  updateUI();

  // Show swipe hint
  setTimeout(() => { swipeHint.classList.add('show'); }, 1500);
  setTimeout(() => { swipeHint.classList.remove('show'); }, 5000);
}

function loadPage(index) {
  const page = track.children[index];
  if (page.querySelector('iframe')) return; // already loaded

  const iframe = document.createElement('iframe');
  iframe.src = PAGES[index].file;
  iframe.loading = index === 0 ? 'eager' : 'lazy';
  iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');
  iframe.addEventListener('load', () => {
    const loader = document.getElementById(`loader-${index}`);
    if (loader) loader.classList.add('hidden');
  });
  page.appendChild(iframe);
}

// ══════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════
function goTo(index, animate = true) {
  if (index < 0 || index >= PAGES.length) return;
  currentIndex = index;

  // Preload adjacent pages
  if (index > 0) loadPage(index - 1);
  loadPage(index);
  if (index < PAGES.length - 1) loadPage(index + 1);

  if (!animate) track.style.transition = 'none';
  track.style.transform = `translateX(-${index * 100}%)`;
  if (!animate) requestAnimationFrame(() => { track.style.transition = ''; });

  updateUI();
}

function updateUI() {
  // Title
  pageTitle.textContent = PAGES[currentIndex].title;

  // Nav items
  const items = nav.querySelectorAll('.nav-item');
  items.forEach((item, i) => {
    item.classList.toggle('active', i === currentIndex);
    const icon = item.querySelector('.icon');
    if (i === currentIndex) {
      icon.style.background = 'var(--amber)';
      icon.style.color = 'var(--bg)';
    } else {
      icon.style.background = 'transparent';
      icon.style.color = '';
    }
  });

  // Scroll active nav item into view
  items[currentIndex]?.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

  // Indicator
  const activeItem = items[currentIndex];
  if (activeItem) {
    navIndicator.style.left = activeItem.offsetLeft + 'px';
    navIndicator.style.width = activeItem.offsetWidth + 'px';
  }

  // Dots
  const dots = pageDots.querySelectorAll('.dot');
  dots.forEach((d, i) => d.classList.toggle('active', i === currentIndex));

  // Drawer
  const dItems = drawerList.querySelectorAll('.drawer-item');
  dItems.forEach((d, i) => d.classList.toggle('active', i === currentIndex));
}

// ══════════════════════════════════════
// TOUCH / SWIPE
// ══════════════════════════════════════
const viewport = document.querySelector('.viewport');

viewport.addEventListener('touchstart', (e) => {
  startX = e.touches[0].clientX;
  isDragging = true;
  track.classList.add('dragging');
}, { passive: true });

viewport.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  currentX = e.touches[0].clientX;
  const diff = currentX - startX;
  const offset = -currentIndex * viewport.offsetWidth + diff;
  track.style.transform = `translateX(${offset}px)`;
}, { passive: true });

viewport.addEventListener('touchend', () => {
  if (!isDragging) return;
  isDragging = false;
  track.classList.remove('dragging');

  const diff = currentX - startX;
  const threshold = viewport.offsetWidth * 0.2;

  if (diff < -threshold && currentIndex < PAGES.length - 1) {
    goTo(currentIndex + 1);
    if (!hasSwiped) { hasSwiped = true; swipeHint.classList.remove('show'); }
  } else if (diff > threshold && currentIndex > 0) {
    goTo(currentIndex - 1);
    if (!hasSwiped) { hasSwiped = true; swipeHint.classList.remove('show'); }
  } else {
    goTo(currentIndex);
  }
  startX = 0;
  currentX = 0;
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goTo(currentIndex + 1);
  if (e.key === 'ArrowLeft') goTo(currentIndex - 1);
});

// ══════════════════════════════════════
// DRAWER
// ══════════════════════════════════════
function toggleDrawer() {
  document.getElementById('drawerOverlay').classList.toggle('open');
}

// ══════════════════════════════════════
// RESIZE
// ══════════════════════════════════════
window.addEventListener('resize', () => goTo(currentIndex, false));

// ══════════════════════════════════════
// BOOT
// ══════════════════════════════════════
init();
</script>
</body>
</html>
