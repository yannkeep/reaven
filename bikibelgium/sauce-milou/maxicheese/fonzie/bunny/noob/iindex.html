<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070810">
<title>⚡ BELGITUDE™ WAR ROOM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=JetBrains+Mono:ital,wght@0,300;0,400;0,700&family=Fredoka:wght@400;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070810;--surface:#0c0d16;--surface2:#10111c;--border:#1a1c2a;--border-light:#252840;
  --fg:#9a9bb0;--fg-bright:#d0d1e0;
  --amber:#ffbf00;--amber-mid:#cc9900;--amber-dim:#4d3800;--amber-glow:rgba(255,191,0,.1);
  --red:#ff3b5c;--green:#00e676;--cyan:#00e5ff;--pink:#ff6baa;--purple:#a78bfa;
  --blue:#4fc3f7;--orange:#ff9100;
  --display:'Orbitron',sans-serif;--mono:'JetBrains Mono',monospace;--body:'Fredoka',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --nav-h:68px;--header-h:52px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body)}

/* ═══════════════════════════════════════════
   BOOT SEQUENCE
   ═══════════════════════════════════════════ */
#boot{
  position:fixed;inset:0;z-index:9999;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .8s ease,transform .8s ease;
}
#boot.done{opacity:0;transform:scale(1.05);pointer-events:none}
#bootLogo{
  font:900 clamp(2rem,6vw,3.5rem) var(--display);color:var(--amber);
  text-shadow:0 0 40px var(--amber-glow),0 0 80px rgba(255,191,0,.05);
  letter-spacing:.12em;opacity:0;transform:scale(.8);
  transition:all 1s cubic-bezier(.16,1,.3,1);margin-bottom:2rem;
}
#bootLogo.show{opacity:1;transform:scale(1)}
#bootLines{
  font:300 .7rem var(--mono);color:var(--amber-dim);text-align:left;
  width:min(400px,85vw);min-height:120px;
}
#bootLines .line{opacity:0;transform:translateY(4px);transition:all .3s}
#bootLines .line.show{opacity:1;transform:translateY(0)}
#bootLines .line.ok{color:var(--green)}
#bootLines .line.warn{color:var(--amber)}
#bootLines .line.err{color:var(--red)}
#bootBar{
  width:min(300px,70vw);height:3px;background:var(--border);margin-top:1.5rem;
  border-radius:2px;overflow:hidden;
}
#bootBarFill{height:100%;width:0;background:var(--amber);border-radius:2px;transition:width .4s}

/* ═══════════════════════════════════════════
   PARTICLE CANVAS
   ═══════════════════════════════════════════ */
#particles{position:fixed;inset:0;z-index:0;pointer-events:none}

/* GRID OVERLAY */
.grid-overlay{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.015;
  background-image:
    linear-gradient(var(--amber) 1px,transparent 1px),
    linear-gradient(90deg,var(--amber) 1px,transparent 1px);
  background-size:80px 80px;
}

/* SCANLINES */
.scanlines{
  position:fixed;inset:0;z-index:9998;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,191,0,.006) 2px,rgba(255,191,0,.006) 4px);
  mix-blend-mode:screen;
}

/* ═══════════════════════════════════════════
   APP SHELL (hidden during boot)
   ═══════════════════════════════════════════ */
#app{opacity:0;transition:opacity .6s;transition-delay:.3s}
#app.ready{opacity:1}

/* ═══════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════ */
.header{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);z-index:100;
  background:linear-gradient(180deg,var(--bg),rgba(7,8,16,.95));
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 .8rem;gap:.6rem;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.h-radar{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--amber-dim);
  position:relative;overflow:hidden;flex-shrink:0;
  background:radial-gradient(circle,rgba(255,191,0,.06) 0%,transparent 70%);
}
.h-radar::before{
  content:'';position:absolute;top:50%;left:50%;width:50%;height:1px;
  background:linear-gradient(90deg,var(--amber),transparent);
  transform-origin:left center;animation:sweep 3s linear infinite;
}
.h-radar::after{
  content:'';position:absolute;top:50%;left:50%;width:3px;height:3px;
  background:var(--amber);border-radius:50%;transform:translate(-50%,-50%);
}
@keyframes sweep{to{transform:rotate(360deg)}}

.h-brand{font:900 .75rem var(--display);color:var(--amber);letter-spacing:.1em;flex-shrink:0;text-shadow:0 0 20px var(--amber-glow)}
.h-divider{width:1px;height:20px;background:var(--border);flex-shrink:0}
.h-page-title{
  font:500 .55rem var(--display);color:var(--fg);letter-spacing:.12em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-transform:uppercase;
}
.h-status{
  display:flex;gap:6px;align-items:center;flex-shrink:0;
}
.h-status .pip{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 4px var(--green)}
.h-status .pip.amber{background:var(--amber);box-shadow:0 0 4px var(--amber)}
.h-status .pip.red{background:var(--red);box-shadow:0 0 4px var(--red);animation:pip-pulse 1s infinite}
@keyframes pip-pulse{0%,100%{opacity:1}50%{opacity:.3}}

.h-btn{
  background:var(--surface2);border:1px solid var(--border);color:var(--fg-bright);
  border-radius:8px;width:34px;height:34px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:.85rem;
  transition:all .2s;flex-shrink:0;
}
.h-btn:active{transform:scale(.9);border-color:var(--amber)}

/* ═══════════════════════════════════════════
   VIEWPORT + 3D CUBE TRANSITION
   ═══════════════════════════════════════════ */
.viewport{
  position:fixed;top:var(--header-h);left:0;right:0;
  bottom:calc(var(--nav-h) + var(--safe-b));
  overflow:hidden;perspective:1200px;
}
.cube{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.4,0,.15,1);
}
.cube.instant{transition:none}
.cube .face{
  position:absolute;inset:0;backface-visibility:hidden;
  overflow:hidden;background:var(--bg);
}
.cube .face iframe{width:100%;height:100%;border:none;background:var(--bg)}
/* The three faces: prev, current, next */
.cube .face.f-prev{transform:translateX(-100%) rotateY(-90deg);transform-origin:right center}
.cube .face.f-curr{transform:translateX(0)}
.cube .face.f-next{transform:translateX(100%) rotateY(90deg);transform-origin:left center}

/* Flat mode fallback for low-end */
.cube.flat{transform-style:flat}
.cube.flat .face.f-prev{transform:translateX(-100%);opacity:0}
.cube.flat .face.f-curr{transform:translateX(0);opacity:1}
.cube.flat .face.f-next{transform:translateX(100%);opacity:0}

/* ═══════════════════════════════════════════
   PAGE LOADER
   ═══════════════════════════════════════════ */
.face-loader{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:var(--bg);z-index:5;
  transition:opacity .4s;
}
.face-loader.hidden{opacity:0;pointer-events:none}
.fl-hex{
  width:50px;height:50px;position:relative;
}
.fl-hex::before{
  content:'';position:absolute;inset:0;border:2px solid var(--amber-dim);
  border-radius:12px;transform:rotate(45deg);animation:hex-spin 2s linear infinite;
}
.fl-hex::after{
  content:'';position:absolute;inset:6px;border:2px solid var(--amber);
  border-radius:8px;transform:rotate(45deg);animation:hex-spin 2s linear infinite reverse;
  border-top-color:transparent;border-right-color:transparent;
}
@keyframes hex-spin{to{transform:rotate(405deg)}}
.fl-text{font:.5rem var(--display);color:var(--amber-dim);letter-spacing:.3em;margin-top:1rem}

/* ═══════════════════════════════════════════
   BOTTOM NAV
   ═══════════════════════════════════════════ */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:linear-gradient(0deg,var(--bg),rgba(7,8,16,.97));
  border-top:1px solid var(--border);
  padding-bottom:var(--safe-b);height:calc(var(--nav-h) + var(--safe-b));
  display:flex;align-items:stretch;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}

.nav-item{
  flex:1 0 0;min-width:60px;padding:.4rem .3rem .2rem;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;
  cursor:pointer;position:relative;border:none;background:none;color:var(--fg);
  transition:all .2s;user-select:none;
}
.nav-item .n-icon{
  width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:1rem;transition:all .25s cubic-bezier(.4,0,.2,1);position:relative;
}
.nav-item .n-label{
  font:500 .45rem var(--display);letter-spacing:.06em;text-transform:uppercase;
  opacity:.35;transition:all .25s;white-space:nowrap;
}
.nav-item.active .n-icon{
  background:var(--amber);color:var(--bg);
  box-shadow:0 0 16px var(--amber-glow),0 4px 12px rgba(255,191,0,.15);
  transform:translateY(-2px) scale(1.08);
}
.nav-item.active .n-label{color:var(--amber);opacity:1}
.nav-item:not(.active):active .n-icon{transform:scale(.85)}

/* glow line */
.nav::before{
  content:'';position:absolute;top:-1px;height:2px;
  background:var(--amber);box-shadow:0 0 12px var(--amber-glow);
  border-radius:1px;transition:all .35s cubic-bezier(.4,0,.15,1);
  z-index:2;
}

/* ═══════════════════════════════════════════
   PAGE DOTS
   ═══════════════════════════════════════════ */
.dots{
  position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 10px);
  left:50%;transform:translateX(-50%);z-index:50;
  display:flex;gap:5px;padding:.25rem .5rem;
  background:rgba(7,8,16,.85);border-radius:1rem;border:1px solid var(--border);
  backdrop-filter:blur(12px);
}
.dots .d{
  width:5px;height:5px;border-radius:50%;background:var(--border-light);transition:all .35s;
}
.dots .d.active{background:var(--amber);box-shadow:0 0 8px var(--amber-glow);width:20px;border-radius:3px}

/* ═══════════════════════════════════════════
   TOUCH RIPPLE
   ═══════════════════════════════════════════ */
.ripple{
  position:fixed;pointer-events:none;z-index:9997;
  width:0;height:0;border-radius:50%;
  background:radial-gradient(circle,rgba(255,191,0,.15),transparent 70%);
  transform:translate(-50%,-50%);animation:ripple-expand .6s ease-out forwards;
}
@keyframes ripple-expand{to{width:200px;height:200px;opacity:0}}

/* ═══════════════════════════════════════════
   TRANSITION GLITCH
   ═══════════════════════════════════════════ */
.glitch-flash{
  position:fixed;inset:0;z-index:9996;pointer-events:none;
  background:var(--amber);mix-blend-mode:overlay;
  opacity:0;
}
.glitch-flash.fire{animation:gflash .15s ease-out}
@keyframes gflash{0%{opacity:.25}100%{opacity:0}}

/* ═══════════════════════════════════════════
   DRAWER
   ═══════════════════════════════════════════ */
.drawer-bg{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);
  opacity:0;pointer-events:none;transition:opacity .3s;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.drawer-bg.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;right:0;top:0;bottom:0;width:min(320px,88vw);z-index:201;
  background:var(--surface);border-left:1px solid var(--border);
  transform:translateX(100%);transition:transform .4s cubic-bezier(.4,0,.15,1);
  display:flex;flex-direction:column;
}
.drawer-bg.open .drawer{transform:translateX(0)}

.drawer-head{
  padding:1.2rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.drawer-head h3{font:700 .6rem var(--display);color:var(--amber);letter-spacing:.25em;text-transform:uppercase}
.drawer-x{
  background:none;border:1px solid var(--border);color:var(--fg);
  width:30px;height:30px;border-radius:8px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font:600 .85rem var(--body);
  transition:all .2s;
}
.drawer-x:hover{border-color:var(--red);color:var(--red)}

.drawer-body{flex:1;overflow-y:auto;padding:.8rem}
.drawer-card{
  display:flex;align-items:center;gap:.8rem;padding:.8rem;
  border:1px solid var(--border);border-radius:.8rem;margin-bottom:.5rem;
  cursor:pointer;transition:all .25s;background:var(--bg);position:relative;overflow:hidden;
}
.drawer-card::before{
  content:'';position:absolute;inset:0;opacity:0;transition:opacity .25s;
}
.drawer-card:active{transform:scale(.97)}
.drawer-card.active{border-color:var(--amber)}
.drawer-card.active::before{
  background:linear-gradient(135deg,rgba(255,191,0,.06),transparent);opacity:1;
}
.drawer-card .dc-icon{
  width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;flex-shrink:0;position:relative;
}
.drawer-card .dc-info{flex:1;min-width:0}
.drawer-card .dc-name{font:600 .8rem var(--body);color:var(--fg-bright);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-card .dc-desc{font:300 .6rem var(--mono);color:#555;margin-top:.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-card .dc-arrow{color:var(--border-light);font-size:.7rem;flex-shrink:0;transition:all .2s}
.drawer-card.active .dc-arrow{color:var(--amber)}

.drawer-footer{
  padding:1rem;border-top:1px solid var(--border);
  font:300 .6rem var(--mono);color:#444;line-height:1.7;
}
.drawer-footer strong{color:var(--amber)}

/* ═══════════════════════════════════════════
   SWIPE HINT
   ═══════════════════════════════════════════ */
.hint{
  position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 34px);
  left:50%;transform:translateX(-50%);z-index:50;
  background:var(--surface2);border:1px solid var(--border);border-radius:2rem;
  padding:.35rem 1rem;font:.55rem var(--mono);color:var(--amber);
  opacity:0;transition:opacity .5s;pointer-events:none;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
}
.hint.show{opacity:1}
.hint .arr{display:inline-block;animation:arr-move 1.5s ease-in-out infinite}
@keyframes arr-move{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}

/* ═══════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════ */
@media(min-width:768px){
  .nav-item{min-width:80px}
  .nav-item .n-label{font-size:.5rem}
}
</style>
</head>
<body>

<!-- ═══ BOOT SEQUENCE ═══ -->
<div id="boot">
  <div id="bootLogo">BELGITUDE™</div>
  <div id="bootLines"></div>

</div>

<!-- ═══ BACKGROUND LAYERS ═══ -->

<!-- ═══ GLITCH FLASH ═══ -->

<!-- ═══ APP SHELL ═══ -->
<div id="app">

  <!-- HEADER -->
  <div class="header">

  <div class="viewport" id="viewport">
    <div class="cube" id="cube">
      <div class="face f-prev" id="facePrev"></div>
      <div class="face f-curr" id="faceCurr"></div>
      <div class="face f-next" id="faceNext"></div>
    </div>
  </div>

  <!-- DOTS -->
  <div class="dots" id="dots"></div>

  <!-- HINT -->
  <div class="hint" id="hint"><span class="arr">→</span> SWIPE</div>

  <!-- NAV -->
  <nav class="nav" id="nav"></nav>

</div>

<!-- ═══ DRAWER ═══ -->
<div class="drawer-bg" id="drawerBg" onclick="toggleDrawer()">
  <div class="drawer" onclick="event.stopPropagation()">
    <div class="drawer-head">
      <h3>Dossiers</h3>

    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-footer">
      Budget : <strong>29€/mois</strong> · Tracking : zéro<br>
      Licence CC BY-NC-SA 4.0<br>
      Doctrine : <strong>Fork · Hack · Spread</strong><br>
      Co-création : Yan & Claude<br>
      <strong>ouaisfieu</strong> · intelligence citoyenne · 2026
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// PAGE REGISTRY
// ══════════════════════════════════════════════
const PAGES = [
  { id:'system',   icon:'⚙️', label:'Système',   title:'BELGITUDE™ — Le Système',            file:'belgitude-fanclub.html',       color:'#48bb78', desc:'CRT brutalist · diagnostic particratie' },
  { id:'scandales',icon:'💣', label:'Scandales',  title:'Ligne Claire — Les Scandales',        file:'belgitude-ligne-claire.html',  color:'#D7263D', desc:'Tintin · Deborsu · Quintin · consanguinité' },
  { id:'exclus',   icon:'👁️', label:'Exclus',     title:'WAKE UP — Les Exclus de la Matrice',  file:'belgitude-matrix-exclus.html', color:'#00ff41', desc:'Matrix · 900K · 10K sans-abri · 44% enfants' },
  { id:'warroom',  icon:'⚔️', label:'Stratégie',  title:'WAR ROOM — Trois Guerres Civiques',   file:'belgitude-warroom.html',       color:'#ffbf00', desc:'Ops tactique · arsenal juridique · art. 23' },
  { id:'guide',    icon:'🎮', label:'Guide',      title:'Résistance Citoyenne — Le Guide',     file:'belgitude-cartoon-guide.html', color:'#FF6B9D', desc:'Cartoon · accessible · tout le monde peut agir' },
  // ─── AJOUTEZ VOS PAGES ICI ───
];
const N = PAGES.length;

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let idx = 0;
let touchStartX = 0, touchStartY = 0, touchDX = 0, isTouch = false, isHorizontal = null;
let loaded = new Set();
let booted = false;

// ══════════════════════════════════════════════
// PARTICLES
// ══════════════════════════════════════════════
const cvs = document.getElementById('particles');
const ctx = cvs.getContext('2d');
let W, H;
const dots = [];
function resize(){ W = cvs.width = innerWidth; H = cvs.height = innerHeight; }
resize(); addEventListener('resize', resize);

for(let i=0;i<60;i++){
  dots.push({
    x:Math.random()*2000, y:Math.random()*2000,
    vx:(Math.random()-.5)*.15, vy:(Math.random()-.5)*.15,
    r:Math.random()*1.5+.5, a:Math.random()*.3+.05
  });
}
function drawParticles(){
  ctx.clearRect(0,0,W,H);
  for(const d of dots){
    d.x += d.vx; d.y += d.vy;
    if(d.x<0)d.x=W; if(d.x>W)d.x=0;
    if(d.y<0)d.y=H; if(d.y>H)d.y=0;
    ctx.beginPath();
    ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,191,0,${d.a})`;
    ctx.fill();
  }
  // connections
  ctx.strokeStyle='rgba(255,191,0,.015)';ctx.lineWidth=.5;
  for(let i=0;i<dots.length;i++){
    for(let j=i+1;j<dots.length;j++){
      const dx=dots[i].x-dots[j].x,dy=dots[i].y-dots[j].y;
      if(dx*dx+dy*dy<18000){
        ctx.beginPath();ctx.moveTo(dots[i].x,dots[i].y);ctx.lineTo(dots[j].x,dots[j].y);ctx.stroke();
      }
    }
  }
  requestAnimationFrame(drawParticles);
}
drawParticles();

// ══════════════════════════════════════════════
// BOOT SEQUENCE
// ══════════════════════════════════════════════
const bootLines = [
  { t:'> init ouaisfieu/warroom v4.0', c:'', d:300 },
  { t:'> loading civic intelligence kernel...', c:'', d:400 },
  { t:'  [OK] 270+ documents verified', c:'ok', d:200 },
  { t:'  [OK] Sources: CRISP · KU Leuven · ULB · Bureau du Plan', c:'ok', d:250 },
  { t:'  [OK] Legal arsenal: Art.23 · IFDH · Cour const.', c:'ok', d:200 },
  { t:'  [!!] 180 000 exclusions en cours', c:'err', d:350 },
  { t:'  [!!] 10 000 sans-abri · 900 000 insécurité alimentaire', c:'err', d:300 },
  { t:'  [OK] Trois Guerres Civiques: armed', c:'ok', d:250 },
  { t:'  [OK] Tracking: ZERO · Budget: 29€/mois', c:'ok', d:200 },
  { t:'> Fork · Hack · Spread', c:'warn', d:400 },
  { t:'> SYSTEM READY — Bienvenue dans la résistance.', c:'ok', d:500 },
];

async function runBoot(){
  const logo = document.getElementById('bootLogo');
  const container = document.getElementById('bootLines');
  const bar = document.getElementById('bootBarFill');

  await sleep(400);
  logo.classList.add('show');
  await sleep(800);

  for(let i=0;i<bootLines.length;i++){
    const b = bootLines[i];
    const el = document.createElement('div');
    el.className = 'line ' + b.c;
    el.textContent = b.t;
    container.appendChild(el);
    await sleep(50);
    el.classList.add('show');
    bar.style.width = ((i+1)/bootLines.length*100)+'%';
    await sleep(b.d);
  }

  await sleep(600);
  document.getElementById('boot').classList.add('done');
  await sleep(400);
  document.getElementById('app').classList.add('ready');
  booted = true;

  // show hint
  setTimeout(()=>document.getElementById('hint').classList.add('show'), 1200);
  setTimeout(()=>document.getElementById('hint').classList.remove('show'), 5000);
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

// ══════════════════════════════════════════════
// BUILD UI
// ══════════════════════════════════════════════
function buildUI(){
  const nav = document.getElementById('nav');
  const dots = document.getElementById('dots');
  const drawer = document.getElementById('drawerBody');

  PAGES.forEach((p,i) => {
    // nav
    const btn = document.createElement('button');
    btn.className = 'nav-item';
    btn.innerHTML = `<div class="n-icon">${p.icon}</div><div class="n-label">${p.label}</div>`;
    btn.addEventListener('click', ()=>goTo(i));
    nav.appendChild(btn);

    // dots
    const d = document.createElement('div');
    d.className = 'd';
    dots.appendChild(d);

    // drawer
    const card = document.createElement('div');
    card.className = 'drawer-card';
    card.innerHTML = `
      <div class="dc-icon" style="background:${p.color}15;color:${p.color}">${p.icon}</div>
      <div class="dc-info"><div class="dc-name">${p.title}</div><div class="dc-desc">${p.desc}</div></div>
      <div class="dc-arrow">›</div>
    `;
    card.addEventListener('click', ()=>{ goTo(i); toggleDrawer(); });
    drawer.appendChild(card);
  });

  loadFace('faceCurr', 0);
  if(N>1) loadFace('faceNext', 1);
  updateUI();
}

// ══════════════════════════════════════════════
// IFRAME LOADING
// ══════════════════════════════════════════════
function loadFace(faceId, pageIndex){
  if(pageIndex<0||pageIndex>=N) return;
  const face = document.getElementById(faceId);
  const existing = face.querySelector('iframe');
  const existingIdx = face.dataset.pageIndex;

  if(existingIdx == pageIndex && existing) return; // already correct

  // clear
  face.innerHTML = `
    <div class="face-loader" id="fl-${faceId}">
      <div class="fl-hex"></div>
      <div class="fl-text">CHARGEMENT</div>
    </div>
  `;
  face.dataset.pageIndex = pageIndex;

  const iframe = document.createElement('iframe');
  iframe.src = PAGES[pageIndex].file;
  iframe.loading = 'eager';
  iframe.setAttribute('sandbox','allow-scripts allow-same-origin');
  iframe.addEventListener('load', ()=>{
    const loader = document.getElementById(`fl-${faceId}`);
    if(loader) loader.classList.add('hidden');
    loaded.add(pageIndex);
  });
  face.appendChild(iframe);
}

// ══════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════
function goTo(newIdx){
  if(newIdx<0||newIdx>=N||newIdx===idx) return;

  // glitch flash
  const gf = document.getElementById('glitchFlash');
  gf.classList.remove('fire');
  void gf.offsetWidth;
  gf.classList.add('fire');

  // ripple at center
  spawnRipple(innerWidth/2, innerHeight/2);

  const dir = newIdx > idx ? 1 : -1;
  idx = newIdx;

  // Load faces
  loadFace('faceCurr', idx);
  if(idx>0) loadFace('facePrev', idx-1);
  if(idx<N-1) loadFace('faceNext', idx+1);

  updateUI();
}

function updateUI(){
  document.getElementById('pageTitle').textContent = PAGES[idx].title;

  // nav
  document.querySelectorAll('.nav-item').forEach((el,i) => {
    el.classList.toggle('active', i===idx);
    const icon = el.querySelector('.n-icon');
    if(i===idx){
      icon.style.background='var(--amber)';icon.style.color='var(--bg)';
      icon.style.boxShadow='0 0 16px var(--amber-glow),0 4px 12px rgba(255,191,0,.15)';
      icon.style.transform='translateY(-2px) scale(1.08)';
    } else {
      icon.style.background='';icon.style.color='';icon.style.boxShadow='';icon.style.transform='';
    }
  });
  // scroll nav
  document.querySelectorAll('.nav-item')[idx]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});

  // nav indicator line
  const activeNav = document.querySelectorAll('.nav-item')[idx];
  if(activeNav){
    const navEl = document.getElementById('nav');
    navEl.style.setProperty('--ind-left', activeNav.offsetLeft+'px');
    navEl.style.setProperty('--ind-w', activeNav.offsetWidth+'px');
    // using ::before
    const s = navEl.style;
    // we'll do it via cssText on the pseudo — actually let's just position it manually
  }

  // dots
  document.querySelectorAll('.dots .d').forEach((d,i)=>d.classList.toggle('active',i===idx));

  // drawer
  document.querySelectorAll('.drawer-card').forEach((c,i)=>c.classList.toggle('active',i===idx));
}

// ══════════════════════════════════════════════
// TOUCH HANDLING
// ══════════════════════════════════════════════
const viewport = document.getElementById('viewport');
const cube = document.getElementById('cube');

viewport.addEventListener('touchstart', e=>{
  if(!booted) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchDX = 0;
  isTouch = true;
  isHorizontal = null;
}, {passive:true});

viewport.addEventListener('touchmove', e=>{
  if(!isTouch) return;
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;

  // determine direction on first significant move
  if(isHorizontal === null && (Math.abs(dx)>8 || Math.abs(dy)>8)){
    isHorizontal = Math.abs(dx) > Math.abs(dy);
  }
  if(!isHorizontal) return; // let vertical scroll pass

  touchDX = dx;
  // subtle visual feedback: tilt the cube slightly
  const pct = dx / viewport.offsetWidth;
  const maxRot = 15;
  cube.style.transition = 'none';
  cube.style.transform = `rotateY(${pct * maxRot}deg)`;
}, {passive:true});

viewport.addEventListener('touchend', ()=>{
  if(!isTouch || !isHorizontal){ isTouch=false; cube.style.transition=''; cube.style.transform=''; return; }
  isTouch = false;
  cube.style.transition = '';
  cube.style.transform = '';

  const threshold = viewport.offsetWidth * 0.18;
  if(touchDX < -threshold && idx < N-1){
    goTo(idx+1);
    document.getElementById('hint').classList.remove('show');
  } else if(touchDX > threshold && idx > 0){
    goTo(idx-1);
    document.getElementById('hint').classList.remove('show');
  }
  touchDX = 0;
}, {passive:true});

// Keyboard
document.addEventListener('keydown', e=>{
  if(!booted) return;
  if(e.key==='ArrowRight') goTo(idx+1);
  if(e.key==='ArrowLeft') goTo(idx-1);
});

// ══════════════════════════════════════════════
// RIPPLE
// ══════════════════════════════════════════════
function spawnRipple(x,y){
  const r = document.createElement('div');
  r.className='ripple';
  r.style.left=x+'px';r.style.top=y+'px';
  document.body.appendChild(r);
  r.addEventListener('animationend',()=>r.remove());
}
document.addEventListener('touchstart', e=>{
  if(!booted) return;
  spawnRipple(e.touches[0].clientX, e.touches[0].clientY);
}, {passive:true});

// ══════════════════════════════════════════════
// DRAWER
// ══════════════════════════════════════════════
function toggleDrawer(){
  document.getElementById('drawerBg').classList.toggle('open');
}

// ══════════════════════════════════════════════
// RESIZE
// ══════════════════════════════════════════════
addEventListener('resize', ()=>{ if(booted) updateUI(); });

// ══════════════════════════════════════════════
// GO
// ══════════════════════════════════════════════
buildUI();
runBoot();
</script>
