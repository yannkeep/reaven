<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur Vidéo Intégré</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-4xl bg-white rounded-xl shadow-xl overflow-hidden">
        
        <header class="bg-blue-600 text-white py-5 px-6">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                </svg>
                Visionnage de la vidéo
            </h1>
        </header>
        
        <div class="p-6 md:p-8">
            <p class="mb-6 text-slate-600 text-lg leading-relaxed">
                Voici la vidéo demandée. Le lecteur ci-dessous est conçu pour conserver ses proportions (format 16:9) quelle que soit la taille de votre écran.
            </p>

            <div class="relative w-full aspect-video rounded-lg overflow-hidden shadow-md border border-slate-200 bg-black">
                <iframe 
                    class="absolute top-0 left-0 w-full h-full"
                    src="https://www.youtube.com/embed/UXVGonUVK5k" 
                    title="YouTube video player" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            </div>
            
            <div class="mt-8 pt-4 border-t border-slate-100 flex justify-between items-center text-sm text-slate-500">
                <span>Source : YouTube</span>
                <a href="https://www.youtube.com/watch?v=UXVGonUVK5k" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline font-medium">
                    Voir sur YouTube &rarr;
                </a>
            </div>
        </div>
        
    </main>

</body>
</html>
