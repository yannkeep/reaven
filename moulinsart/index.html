
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/tokyo-night-dark.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --lilac: #b19cd9;
            --lilac-bright: #c9b3ff;
            --lilac-dim: #9575cd;
            --purple: #8b5cf6;
            --terminal-green: #00ff41;
            --terminal-green-bright: #39ff14;
            --bg-light: #f5f3f7;
            --bg-lighter: #faf9fb;
            --glass-bg: rgba(245, 243, 247, 0.85);
            --text-dark: #2d1b3d;
            --editor-bg: #ffffff;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        @keyframes glow-pulse {
            0%, 100% { filter: drop-shadow(0 0 3px var(--lilac)) drop-shadow(0 0 8px var(--lilac)); }
            50% { filter: drop-shadow(0 0 6px var(--lilac-bright)) drop-shadow(0 0 12px var(--lilac-bright)); }
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--bg-lighter);
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--lilac), transparent);
            animation: scanline 8s linear infinite;
            opacity: 0.15;
            pointer-events: none;
            z-index: 1000;
        }

        .container {
            max-width: 100vw;
            margin: 0 auto;
            padding: 1rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 1.5rem 1rem;
            border-bottom: 2px solid var(--lilac);
            box-shadow: 0 2px 20px rgba(177, 156, 217, 0.3);
            margin-bottom: 1rem;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 12px 12px 0 0;
        }

        h1 {
            font-size: clamp(1.2rem, 4vw, 2rem);
            text-transform: uppercase;
            letter-spacing: 0.3em;
            animation: glow-pulse 3s ease-in-out infinite;
            text-shadow: 0 0 10px var(--lilac), 0 0 20px var(--lilac);
            color: var(--lilac-dim);
        }

        .subtitle {
            color: var(--terminal-green);
            font-size: 0.8rem;
            margin-top: 0.3rem;
            letter-spacing: 0.2em;
            text-shadow: 0 0 5px var(--terminal-green);
        }

        .toolbar {
            display: flex;
            gap: 0.5rem;
            padding: 0.8rem;
            background: var(--glass-bg);
            border: 1px solid var(--lilac);
            border-radius: 8px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .toolbar-btn {
            background: rgba(177, 156, 217, 0.2);
            border: 1px solid var(--lilac);
            color: var(--lilac-dim);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .toolbar-btn:hover {
            background: rgba(177, 156, 217, 0.4);
            box-shadow: 0 0 15px rgba(177, 156, 217, 0.4);
            transform: translateY(-2px);
        }

        .toolbar-btn.active {
            background: rgba(0, 255, 65, 0.2);
            border-color: var(--terminal-green);
            color: var(--terminal-green);
        }

        .toolbar-separator {
            width: 1px;
            height: 30px;
            background: var(--lilac);
            opacity: 0.3;
        }

        .filename-input {
            flex: 1;
            min-width: 200px;
            background: white;
            border: 1px solid var(--lilac-dim);
            color: var(--text-dark);
            padding: 0.5rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .filename-input:focus {
            outline: none;
            border-color: var(--lilac);
            box-shadow: 0 0 10px rgba(177, 156, 217, 0.3);
        }

        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 1rem;
            overflow: hidden;
        }

        .sidebar {
            background: var(--glass-bg);
            border: 2px solid var(--terminal-green);
            border-radius: 8px;
            padding: 1rem;
            backdrop-filter: blur(10px);
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
            display: flex;
            flex-direction: column;
        }

        .sidebar-title {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--terminal-green);
            text-shadow: 0 0 8px var(--terminal-green);
            border-bottom: 1px solid var(--terminal-green);
            padding-bottom: 0.5rem;
        }

        .upload-area {
            border: 2px dashed var(--lilac);
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(177, 156, 217, 0.05);
            font-size: 0.8rem;
        }

        .upload-area:hover {
            border-color: var(--purple);
            background: rgba(177, 156, 217, 0.1);
            box-shadow: 0 0 20px rgba(177, 156, 217, 0.2);
        }

        .upload-area.drag-over {
            border-color: var(--terminal-green);
            background: rgba(0, 255, 65, 0.1);
        }

        .upload-icon {
            font-size: 2rem;
            color: var(--lilac);
            margin-bottom: 0.5rem;
        }

        input[type="file"] {
            display: none;
        }

        .file-tree {
            flex: 1;
            overflow-y: auto;
        }

        .file-item {
            padding: 0.6rem;
            margin-bottom: 0.4rem;
            border: 1px solid var(--lilac-dim);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }

        .file-item:hover {
            border-color: var(--lilac);
            background: rgba(177, 156, 217, 0.2);
            transform: translateX(5px);
        }

        .file-item.active {
            border-color: var(--terminal-green);
            background: rgba(0, 255, 65, 0.15);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.4);
        }

        .file-icon {
            font-size: 1rem;
            min-width: 1rem;
        }

        .file-name {
            flex: 1;
            word-break: break-word;
        }

        .file-item.active .file-name {
            color: var(--terminal-green-bright);
        }

        .share-btn {
            margin-top: 0.5rem;
            width: 100%;
            background: rgba(177, 156, 217, 0.2);
            border: 1px solid var(--lilac);
            color: var(--lilac-dim);
            padding: 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .share-btn:hover {
            background: rgba(177, 156, 217, 0.4);
            box-shadow: 0 0 15px rgba(177, 156, 217, 0.4);
        }

        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            overflow: hidden;
        }

        .editor-container.preview-only {
            grid-template-columns: 1fr;
        }

        .editor-container.editor-only {
            grid-template-columns: 1fr;
        }

        .editor-panel, .preview-panel {
            background: white;
            border: 2px solid var(--lilac);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(177, 156, 217, 0.2);
        }

        .panel-header {
            background: var(--lilac);
            color: white;
            padding: 0.6rem 1rem;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-tools {
            display: flex;
            gap: 0.5rem;
        }

        .panel-tool-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.3s ease;
        }

        .panel-tool-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .editor-textarea {
            flex: 1;
            padding: 1.5rem;
            border: none;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: none;
            color: var(--text-dark);
            background: var(--editor-bg);
        }

        .editor-textarea:focus {
            outline: none;
        }

        .preview-content {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            line-height: 1.8;
        }

        .preview-content h1,
        .preview-content h2,
        .preview-content h3,
        .preview-content h4,
        .preview-content h5,
        .preview-content h6 {
            color: var(--lilac-dim);
            margin: 2rem 0 1rem;
            text-shadow: 0 0 5px rgba(177, 156, 217, 0.3);
            border-bottom: 2px solid var(--lilac);
            padding-bottom: 0.5rem;
        }

        .preview-content h1 { font-size: 2rem; }
        .preview-content h2 { font-size: 1.6rem; }
        .preview-content h3 { font-size: 1.3rem; }

        .preview-content p {
            margin: 1rem 0;
        }

        .preview-content a {
            color: var(--purple);
            text-decoration: none;
            border-bottom: 1px solid var(--purple);
        }

        .preview-content code {
            background: rgba(177, 156, 217, 0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            color: var(--purple);
            font-size: 0.9em;
            border: 1px solid var(--lilac);
        }

        .preview-content pre {
            background: #1a1b26;
            border: 2px solid var(--terminal-green);
            border-radius: 8px;
            padding: 1.5rem;
            overflow-x: auto;
            margin: 1.5rem 0;
        }

        .preview-content pre code {
            background: none;
            border: none;
            padding: 0;
            color: var(--terminal-green);
        }

        .preview-content blockquote {
            border-left: 4px solid var(--lilac);
            padding-left: 1.5rem;
            margin: 1.5rem 0;
            color: var(--lilac-dim);
            font-style: italic;
            background: rgba(177, 156, 217, 0.05);
            padding: 1rem 1.5rem;
            border-radius: 0 8px 8px 0;
        }

        .preview-content ul, .preview-content ol {
            margin: 1rem 0 1rem 2rem;
        }

        .preview-content li {
            margin: 0.5rem 0;
        }

        .preview-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 2px solid var(--lilac);
            margin: 1.5rem 0;
        }

        .preview-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            border: 2px solid var(--lilac);
            border-radius: 8px;
            overflow: hidden;
        }

        .preview-content th {
            background: var(--lilac);
            color: white;
            padding: 0.8rem;
            text-align: left;
        }

        .preview-content td {
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid var(--lilac);
        }

        .preview-content tr:hover {
            background: rgba(177, 156, 217, 0.1);
        }

        .stats-bar {
            background: var(--glass-bg);
            border-top: 1px solid var(--lilac);
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            color: var(--lilac-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--glass-bg);
            border: 2px solid var(--lilac);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            color: var(--text-dark);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(177, 156, 217, 0.3);
            z-index: 3000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .toast.active {
            transform: translateY(0);
            opacity: 1;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 4000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-lighter);
            border: 2px solid var(--lilac);
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(177, 156, 217, 0.5);
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 2px solid var(--lilac);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--lilac-dim);
        }

        .modal-close {
            background: rgba(177, 156, 217, 0.2);
            border: 1px solid var(--lilac);
            color: var(--lilac-dim);
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(177, 156, 217, 0.4);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-section {
            margin-bottom: 1.5rem;
        }

        .modal-section:last-child {
            margin-bottom: 0;
        }

        .modal-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--lilac-dim);
        }

        .modal-btn {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--lilac);
            background: rgba(177, 156, 217, 0.2);
            color: var(--lilac-dim);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-family: 'Courier New', monospace;
        }

        .modal-btn:hover {
            background: rgba(177, 156, 217, 0.4);
            box-shadow: 0 0 15px rgba(177, 156, 217, 0.4);
            transform: translateY(-2px);
        }

        .qr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: white;
            border-radius: 12px;
            margin-top: 1rem;
        }

        #qrcode {
            padding: 1rem;
        }

        .share-info {
            font-size: 0.85rem;
            color: var(--text-dark);
            text-align: center;
            line-height: 1.5;
            opacity: 0.7;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(177, 156, 217, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--lilac);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--lilac-bright);
        }

        @media (max-width: 1200px) {
            .workspace {
                grid-template-columns: 200px 1fr;
            }
        }

        @media (max-width: 768px) {
            .workspace {
                grid-template-columns: 1fr;
            }

            .sidebar {
                max-height: 200px;
            }

            .editor-container {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
            }

            .filename-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>MD Editor</h1>
            <div class="subtitle">[ edit.preview.export.share.markdown ]</div>
        </header>

        <div class="toolbar">
            <button class="toolbar-btn" onclick="newFile()">
                📄 Nouveau
            </button>
            <button class="toolbar-btn" onclick="saveFile()">
                💾 Sauvegarder
            </button>
            <button class="toolbar-btn" onclick="exportMd()">
                📥 Export MD
            </button>
            <button class="toolbar-btn" onclick="exportHtml()">
                🌐 Export HTML
            </button>

            <div class="toolbar-separator"></div>

            <button class="toolbar-btn active" id="viewSplit" onclick="setView('split')">
                ⚏ Split
            </button>
            <button class="toolbar-btn" id="viewEditor" onclick="setView('editor')">
                ✏️ Edit
            </button>
            <button class="toolbar-btn" id="viewPreview" onclick="setView('preview')">
                👁️ Preview
            </button>

            <div class="toolbar-separator"></div>

            <input type="text" class="filename-input" id="filenameInput" placeholder="nom-du-fichier.md">
        </div>

        <div class="workspace">
            <div class="sidebar">
                <h3 class="sidebar-title">⟩ Fichiers</h3>

                <label for="fileInput" class="upload-area" id="uploadArea">
                    <div class="upload-icon">⬆</div>
                    <div>Charger .md / .json</div>
                </label>
                <input type="file" id="fileInput" accept=".md,.markdown,.json" multiple>

                <div class="file-tree" id="fileTree">
                    <div style="padding: 1rem; text-align: center; color: var(--lilac-dim); font-size: 0.8rem;">Aucun fichier</div>
                </div>

                <button class="share-btn" onclick="openShareModal()">
                    🌐 Partager
                </button>
            </div>

            <div class="editor-container" id="editorContainer">
                <div class="editor-panel" id="editorPanel">
                    <div class="panel-header">
                        ✏️ Éditeur
                        <div class="panel-tools">
                            <button class="panel-tool-btn" onclick="insertText('# ')" title="Titre">H</button>
                            <button class="panel-tool-btn" onclick="insertText('**', '**')" title="Gras">B</button>
                            <button class="panel-tool-btn" onclick="insertText('*', '*')" title="Italique">I</button>
                            <button class="panel-tool-btn" onclick="insertText('`', '`')" title="Code">{ }</button>
                            <button class="panel-tool-btn" onclick="insertText('[', '](url)')" title="Lien">🔗</button>
                            <button class="panel-tool-btn" onclick="insertText('- ')" title="Liste">•</button>
                        </div>
                    </div>
                    <textarea class="editor-textarea" id="editor" placeholder="Commencez à écrire..."></textarea>
                    <div class="stats-bar">
                        <div class="stat-item">📝 <span id="charCount">0</span> caractères</div>
                        <div class="stat-item">📊 <span id="wordCount">0</span> mots</div>
                        <div class="stat-item">📄 <span id="lineCount">0</span> lignes</div>
                    </div>
                </div>

                <div class="preview-panel" id="previewPanel">
                    <div class="panel-header">
                        👁️ Aperçu en temps réel
                    </div>
                    <div class="preview-content" id="preview"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <div class="modal" id="shareModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🌐 Partager</div>
                <button class="modal-close" onclick="closeShareModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="modal-section">
                    <label class="modal-label">Export JSON</label>
                    <button class="modal-btn" onclick="exportJson()">
                        📦 Télécharger JSON
                    </button>
                    <div class="share-info">Exporte tous vos fichiers dans un format JSON interopérable</div>
                </div>

                <div class="modal-section">
                    <label class="modal-label">Partage QR Code</label>
                    <button class="modal-btn" onclick="generateQRCode()">
                        📱 Générer QR Code
                    </button>
                    <div id="qrContainer" style="display: none;"></div>
                </div>

                <div class="modal-section">
                    <label class="modal-label">Lien de partage</label>
                    <button class="modal-btn" onclick="copyShareLink()">
                        🔗 Copier lien
                    </button>
                    <div class="share-info">Crée un lien avec vos données encodées</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let files = [];
        let currentIndex = null;
        let currentView = 'split';

        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return hljs.highlight(code, { language: lang }).value;
                    } catch (err) {}
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
            gfm: true
        });

        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const fileTree = document.getElementById('fileTree');
        const filenameInput = document.getElementById('filenameInput');
        const editorContainer = document.getElementById('editorContainer');

        editor.addEventListener('input', () => {
            updatePreview();
            updateStats();
            if (currentIndex !== null) {
                files[currentIndex].content = editor.value;
                files[currentIndex].modified = true;
            }
        });

        function updatePreview() {
            preview.innerHTML = marked.parse(editor.value || '');
        }

        function updateStats() {
            const text = editor.value;
            document.getElementById('charCount').textContent = text.length;
            document.getElementById('wordCount').textContent = text.trim() ? text.trim().split(/\s+/).length : 0;
            document.getElementById('lineCount').textContent = text.split('\n').length;
        }

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => {
            uploadArea.addEventListener(e, evt => {
                evt.preventDefault();
                evt.stopPropagation();
            });
        });

        ['dragenter', 'dragover'].forEach(e => {
            uploadArea.addEventListener(e, () => uploadArea.classList.add('drag-over'));
        });

        ['dragleave', 'drop'].forEach(e => {
            uploadArea.addEventListener(e, () => uploadArea.classList.remove('drag-over'));
        });

        uploadArea.addEventListener('drop', e => {
            handleFiles(Array.from(e.dataTransfer.files));
        });

        fileInput.addEventListener('change', e => {
            handleFiles(Array.from(e.target.files));
            fileInput.value = '';
        });

        function handleFiles(fileArray) {
            fileArray.forEach(file => {
                if (file.name.endsWith('.md') || file.name.endsWith('.markdown')) {
                    loadFile(file);
                } else if (file.name.endsWith('.json')) {
                    loadJsonFile(file);
                } else {
                    showToast('❌ Fichier non supporté');
                }
            });
        }

        function loadFile(file) {
            const reader = new FileReader();
            reader.onload = e => {
                const idx = files.findIndex(f => f.name === file.name);

                if (idx !== -1) {
                    files[idx].content = e.target.result;
                    files[idx].modified = false;
                } else {
                    files.push({
                        name: file.name,
                        content: e.target.result,
                        modified: false
                    });
                }

                updateFileTree();
                openFile(idx !== -1 ? idx : files.length - 1);
                showToast('✅ Fichier chargé');
            };
            reader.readAsText(file);
        }

        function loadJsonFile(file) {
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const data = JSON.parse(e.target.result);

                    if (Array.isArray(data)) {
                        data.forEach(item => {
                            if (item.name && item.content) {
                                const idx = files.findIndex(f => f.name === item.name);
                                if (idx !== -1) {
                                    files[idx].content = item.content;
                                    files[idx].modified = false;
                                } else {
                                    files.push({
                                        name: item.name,
                                        content: item.content,
                                        modified: false
                                    });
                                }
                            }
                        });
                        updateFileTree();
                        if (files.length > 0) openFile(0);
                        showToast(`📦 ${data.length} fichiers importés`);
                    } else {
                        showToast('❌ Format JSON invalide');
                    }
                } catch (err) {
                    showToast('❌ Erreur parsing JSON');
                }
            };
            reader.readAsText(file);
        }

        function updateFileTree() {
            if (files.length === 0) {
                fileTree.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--lilac-dim); font-size: 0.8rem;">Aucun fichier</div>';
                return;
            }

            fileTree.innerHTML = files.map((file, index) => `
                <div class="file-item ${currentIndex === index ? 'active' : ''}" onclick="openFile(${index})">
                    <span class="file-icon">📄</span>
                    <div class="file-name">${file.name}</div>
                </div>
            `).join('');
        }

        function openFile(index) {
            currentIndex = index;
            editor.value = files[index].content;
            filenameInput.value = files[index].name;
            updatePreview();
            updateStats();
            updateFileTree();
        }

        function newFile() {
            const fileName = `nouveau-${Date.now()}.md`;
            files.push({
                name: fileName,
                content: '# Nouveau document\n\nCommencez à écrire ici...',
                modified: true
            });
            updateFileTree();
            openFile(files.length - 1);
            showToast('📄 Nouveau fichier créé');
        }

        function saveFile() {
            if (currentIndex === null) {
                showToast('❌ Aucun fichier à sauvegarder');
                return;
            }

            const content = editor.value;
            const filename = filenameInput.value || files[currentIndex].name;

            files[currentIndex].content = content;
            files[currentIndex].name = filename;
            files[currentIndex].modified = false;

            const blob = new Blob([content], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);

            updateFileTree();
            showToast(`💾 "${filename}" sauvegardé`);
        }

        function exportMd() {
            if (currentIndex === null || !editor.value.trim()) {
                showToast('❌ Aucun contenu à exporter');
                return;
            }

            const filename = filenameInput.value || files[currentIndex].name || 'document.md';

            const blob = new Blob([editor.value], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);

            showToast(`📥 "${filename}" exporté`);
        }

        function exportHtml() {
            if (currentIndex === null || !editor.value.trim()) {
                showToast('❌ Aucun contenu à exporter');
                return;
            }

            const filename = (filenameInput.value || files[currentIndex].name || 'document.md').replace('.md', '.html');

            const html = `<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${filename.replace('.html', '')}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 2rem;
            line-height: 1.6;
            color: #2d1b3d;
        }
        h1, h2, h3 {
            color: #9575cd;
            margin-top: 2rem;
            border-bottom: 2px solid #b19cd9;
            padding-bottom: 0.5rem;
        }
        code {
            background: rgba(177, 156, 217, 0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            color: #8b5cf6;
            border: 1px solid #b19cd9;
        }
        pre {
            background: #1a1b26;
            color: #00ff41;
            padding: 1.5rem;
            border-radius: 8px;
            overflow-x: auto;
            border: 2px solid #00ff41;
        }
        pre code {
            background: none;
            border: none;
            color: #00ff41;
        }
        blockquote {
            border-left: 4px solid #b19cd9;
            padding-left: 1.5rem;
            color: #9575cd;
            font-style: italic;
            background: rgba(177, 156, 217, 0.05);
            padding: 1rem 1.5rem;
            border-radius: 0 8px 8px 0;
        }
    </style>
</head>
<body>
${preview.innerHTML}
</body>
</html>`;

            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);

            showToast(`🌐 "${filename}" exporté`);
        }

        function exportJson() {
            if (files.length === 0) {
                showToast('❌ Aucun fichier à exporter');
                return;
            }

            const data = files.map(f => ({
                name: f.name,
                content: f.content
            }));

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `markdown-files-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);

            showToast('📦 JSON exporté');
        }

        function openShareModal() {
            document.getElementById('shareModal').classList.add('show');
            document.getElementById('qrContainer').style.display = 'none';
            document.getElementById('qrContainer').innerHTML = '';
        }

        function closeShareModal() {
            document.getElementById('shareModal').classList.remove('show');
        }

        function generateQRCode() {
            if (files.length === 0) {
                showToast('❌ Aucun fichier à partager');
                return;
            }

            const data = files.map(f => ({ name: f.name, content: f.content }));
            const jsonStr = JSON.stringify(data);
            const compressed = btoa(encodeURIComponent(jsonStr));
            const shareUrl = `${window.location.origin}${window.location.pathname}?data=${compressed}`;

            const qrContainer = document.getElementById('qrContainer');
            qrContainer.innerHTML = '<div class="qr-container"><div id="qrcode"></div><div class="share-info">Scannez pour récupérer vos fichiers</div></div>';

            new QRCode(document.getElementById('qrcode'), {
                text: shareUrl,
                width: 200,
                height: 200,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });

            qrContainer.style.display = 'block';
            showToast('📱 QR Code généré');
        }

        function copyShareLink() {
            if (files.length === 0) {
                showToast('❌ Aucun fichier à partager');
                return;
            }

            const data = files.map(f => ({ name: f.name, content: f.content }));
            const jsonStr = JSON.stringify(data);
            const compressed = btoa(encodeURIComponent(jsonStr));
            const shareUrl = `${window.location.origin}${window.location.pathname}?data=${compressed}`;

            navigator.clipboard.writeText(shareUrl).then(() => {
                showToast('🔗 Lien copié');
            }).catch(() => {
                showToast('❌ Erreur copie');
            });
        }

        function loadFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const data = urlParams.get('data');

            if (data) {
                try {
                    const jsonStr = decodeURIComponent(atob(data));
                    const filesData = JSON.parse(jsonStr);

                    if (Array.isArray(filesData)) {
                        files = filesData.map(f => ({
                            name: f.name,
                            content: f.content,
                            modified: false
                        }));
                        updateFileTree();
                        if (files.length > 0) openFile(0);
                        showToast('🔗 Fichiers chargés depuis le lien');
                        window.history.replaceState({}, '', window.location.pathname);
                    }
                } catch (err) {
                    console.error('Erreur chargement URL:', err);
                }
            }
        }

        function setView(view) {
            currentView = view;

            document.getElementById('viewSplit').classList.remove('active');
            document.getElementById('viewEditor').classList.remove('active');
            document.getElementById('viewPreview').classList.remove('active');

            editorContainer.classList.remove('editor-only', 'preview-only');

            if (view === 'split') {
                document.getElementById('viewSplit').classList.add('active');
                document.getElementById('editorPanel').style.display = 'flex';
                document.getElementById('previewPanel').style.display = 'flex';
            } else if (view === 'editor') {
                document.getElementById('viewEditor').classList.add('active');
                editorContainer.classList.add('editor-only');
                document.getElementById('editorPanel').style.display = 'flex';
                document.getElementById('previewPanel').style.display = 'none';
            } else if (view === 'preview') {
                document.getElementById('viewPreview').classList.add('active');
                editorContainer.classList.add('preview-only');
                document.getElementById('editorPanel').style.display = 'none';
                document.getElementById('previewPanel').style.display = 'flex';
            }
        }

        function insertText(before, after = '') {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value;
            const selected = text.substring(start, end);

            const newText = text.substring(0, start) + before + selected + after + text.substring(end);
            editor.value = newText;

            const newPos = start + before.length + selected.length;
            editor.setSelectionRange(newPos, newPos);
            editor.focus();

            updatePreview();
            updateStats();

            if (currentIndex !== null) {
                files[currentIndex].content = editor.value;
                files[currentIndex].modified = true;
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('active');
            setTimeout(() => toast.classList.remove('active'), 2000);
        }

        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveFile();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                e.preventDefault();
                newFile();
            }
        });

        let autoSaveTimer;
        editor.addEventListener('input', () => {
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                if (files.length > 0) {
                    localStorage.setItem('md-editor-autosave', JSON.stringify({
                        files: files,
                        currentIndex: currentIndex
                    }));
                }
            }, 1000);
        });

        window.addEventListener('load', () => {
            loadFromUrl();

            const saved = localStorage.getItem('md-editor-autosave');
            if (saved && files.length === 0) {
                try {
                    const data = JSON.parse(saved);
                    if (data.files && data.files.length > 0) {
                        files = data.files;
                        updateFileTree();
                        openFile(data.currentIndex || 0);
                        showToast('📂 Session restaurée');
                    }
                } catch (e) {
                    console.error('Erreur restauration:', e);
                }
            }
        });

        updatePreview();
        updateStats();
    </script>
</body>
</html>
