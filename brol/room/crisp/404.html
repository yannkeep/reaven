// ══════════════════════════════════════════════
// BUILD INDEX
// ══════════════════════════════════════════════

const nodeMap = {};
nodes.forEach(n => { nodeMap[n.id] = n; n.edges = []; });
edges.forEach(e => {
  if(nodeMap[e.s] && nodeMap[e.t]){
    nodeMap[e.s].edges.push(e.t);
    nodeMap[e.t].edges.push(e.s);
  }
});

// ══════════════════════════════════════════════
// CANVAS & PHYSICS
// ══════════════════════════════════════════════

const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');
let W, H, dpr;
let cam = {x:0, y:0, zoom:1};
let dragging = false, dragStart = null, camStart = null;
let hovered = null, focused = null;
let activeTypes = new Set(Object.keys(TYPES));

function resize(){
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener('resize', resize);

// Initialize positions in a circle
const N = nodes.length;
nodes.forEach((n,i) => {
  const angle = (i/N)*Math.PI*2;
  const spread = Math.min(W,H)*.35;
  const typeIdx = Object.keys(TYPES).indexOf(n.type);
  const ring = spread * (.5 + typeIdx*.08);
  n.x = Math.cos(angle)*ring + (Math.random()-.5)*80;
  n.y = Math.sin(angle)*ring + (Math.random()-.5)*80;
  n.vx = 0; n.vy = 0;
  n.targetR = TYPES[n.type].r;
  n.r = n.targetR;
});

// Force simulation
function simulate(){
  const alpha = .15;
  
  // Repulsion between all nodes
  for(let i=0;i<N;i++){
    for(let j=i+1;j<N;j++){
      let dx = nodes[j].x - nodes[i].x;
      let dy = nodes[j].y - nodes[i].y;
      let d = Math.sqrt(dx*dx+dy*dy) || 1;
      let force = -800/(d*d);
      let fx = (dx/d)*force;
      let fy = (dy/d)*force;
      nodes[i].vx += fx; nodes[i].vy += fy;
      nodes[j].vx -= fx; nodes[j].vy -= fy;
    }
  }
  
  // Attraction along edges
  edges.forEach(e => {
    const a = nodeMap[e.s], b = nodeMap[e.t];
    if(!a||!b) return;
    let dx = b.x - a.x;
    let dy = b.y - a.y;
    let d = Math.sqrt(dx*dx+dy*dy) || 1;
    const idealDist = 100;
    let force = (d - idealDist)*.003;
    let fx = (dx/d)*force;
    let fy = (dy/d)*force;
    a.vx += fx; a.vy += fy;
    b.vx -= fx; b.vy -= fy;
  });
  
  // Center gravity
  nodes.forEach(n => {
    n.vx -= n.x * .0004;
    n.vy -= n.y * .0004;
  });
  
  // Apply velocity with damping
  nodes.forEach(n => {
    n.vx *= .85;
    n.vy *= .85;
    n.x += n.vx * alpha;
    n.y += n.vy * alpha;
  });
}

// ══════════════════════════════════════════════
// RENDERING
// ══════════════════════════════════════════════

function worldToScreen(wx,wy){
  return {
    x: (wx - cam.x)*cam.zoom + W/2,
    y: (wy - cam.y)*cam.zoom + H/2
  };
}
function screenToWorld(sx,sy){
  return {
    x: (sx - W/2)/cam.zoom + cam.x,
    y: (sy - H/2)/cam.zoom + cam.y
  };
}

function draw(){
  simulate();
  
  ctx.clearRect(0,0,W,H);
  
  // Background gradient
  const grad = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.6);
  grad.addColorStop(0,'#10101c');
  grad.addColorStop(1,'#0a0a10');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  
  const focusedEdges = new Set();
  const focusedNodes = new Set();
  if(focused){
    focusedNodes.add(focused.id);
    focused.edges.forEach(id => focusedNodes.add(id));
  }

  // Draw edges
  edges.forEach(e => {
    const a = nodeMap[e.s], b = nodeMap[e.t];
    if(!a||!b) return;
    if(!activeTypes.has(a.type) || !activeTypes.has(b.type)) return;
    
    const sa = worldToScreen(a.x, a.y);
    const sb = worldToScreen(b.x, b.y);
    
    let alpha = .06;
    let width = .5;
    
    if(focused){
      if(focusedNodes.has(a.id) && focusedNodes.has(b.id)){
        alpha = .35;
        width = 1.2;
      } else {
        alpha = .015;
      }
    }
    if(hovered && !focused){
      if(hovered.edges.includes(a.id) || hovered.edges.includes(b.id)){
        if(a.id===hovered.id || b.id===hovered.id){
          alpha = .3;
          width = 1;
        }
      }
    }
    
    ctx.beginPath();
    ctx.moveTo(sa.x, sa.y);
    ctx.lineTo(sb.x, sb.y);
    ctx.strokeStyle = `rgba(232,228,220,${alpha})`;
    ctx.lineWidth = width * cam.zoom;
    ctx.stroke();
  });
  
  // Draw nodes
  nodes.forEach(n => {
    if(!activeTypes.has(n.type)) return;
    const s = worldToScreen(n.x, n.y);
    const t = TYPES[n.type];
    let r = n.r * cam.zoom;
    let alpha = 1;
    
    if(focused){
      if(focusedNodes.has(n.id)){
        alpha = 1;
        r *= 1.15;
      } else {
        alpha = .1;
      }
    }
    
    if(hovered === n){
      r *= 1.4;
    }
    
    // Glow
    if(alpha > .3 && r > 2){
      ctx.beginPath();
      ctx.arc(s.x, s.y, r*2.5, 0, Math.PI*2);
      const g = ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,r*2.5);
      g.addColorStop(0, t.glow);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.globalAlpha = alpha * .6;
      ctx.fill();
    }
    
    // Node
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI*2);
    ctx.fillStyle = t.color;
    ctx.globalAlpha = alpha;
    ctx.fill();
    
    // Label (only if zoomed enough or hovered/focused)
    if((cam.zoom > .8 && r > 3) || hovered===n || (focused && focusedNodes.has(n.id))){
      ctx.globalAlpha = alpha * (hovered===n || (focused && focusedNodes.has(n.id)) ? .9 : .45);
      ctx.font = `${Math.max(8,9*cam.zoom)}px 'Space Mono',monospace`;
      ctx.fillStyle = '#e8e4dc';
      ctx.textAlign = 'center';
      ctx.fillText(n.name, s.x, s.y - r - 5*cam.zoom);
    }
    
    ctx.globalAlpha = 1;
  });
  
  requestAnimationFrame(draw);
}

draw();

// ══════════════════════════════════════════════
// INTERACTION
// ══════════════════════════════════════════════

function getNodeAt(sx,sy){
  const w = screenToWorld(sx,sy);
  let best = null, bestD = Infinity;
  nodes.forEach(n => {
    if(!activeTypes.has(n.type)) return;
    const dx = n.x - w.x, dy = n.y - w.y;
    const d = Math.sqrt(dx*dx+dy*dy);
    const hitR = (n.r + 5) / cam.zoom;
    if(d < hitR && d < bestD){ best = n; bestD = d; }
  });
  return best;
}

// Tooltip
const tooltip = document.getElementById('tooltip');
const ttType = document.getElementById('ttType');
const ttName = document.getElementById('ttName');
const ttDesc = document.getElementById('ttDesc');
const ttLinks = document.getElementById('ttLinks');

function showTooltip(n, sx, sy){
  const t = TYPES[n.type];
  ttType.textContent = t.label;
  ttType.style.color = t.color;
  ttName.textContent = n.name;
  ttName.style.color = t.color;
  ttDesc.textContent = n.desc;
  ttLinks.textContent = n.edges.length + ' connexion' + (n.edges.length>1?'s':'');
  
  let tx = sx + 16, ty = sy - 10;
  if(tx + 320 > W) tx = sx - 330;
  if(ty + 150 > H) ty = H - 160;
  if(ty < 60) ty = 60;
  
  tooltip.style.left = tx+'px';
  tooltip.style.top = ty+'px';
  tooltip.classList.add('show');
}
function hideTooltip(){ tooltip.classList.remove('show'); }

canvas.addEventListener('mousemove', e => {
  if(dragging) return;
  const n = getNodeAt(e.clientX, e.clientY);
  if(n !== hovered){
    hovered = n;
    if(n) showTooltip(n, e.clientX, e.clientY);
    else hideTooltip();
    canvas.style.cursor = n ? 'pointer' : 'grab';
  } else if(n){
    showTooltip(n, e.clientX, e.clientY);
  }
});

canvas.addEventListener('click', e => {
  const n = getNodeAt(e.clientX, e.clientY);
  if(n){
    if(focused === n) focused = null;
    else focused = n;
  } else {
    focused = null;
  }
});

// Pan
canvas.addEventListener('mousedown', e => {
  const n = getNodeAt(e.clientX, e.clientY);
  if(!n){
    dragging = true;
    dragStart = {x:e.clientX, y:e.clientY};
    camStart = {x:cam.x, y:cam.y};
    hideTooltip();
  }
});
window.addEventListener('mousemove', e => {
  if(!dragging) return;
  const dx = (e.clientX - dragStart.x)/cam.zoom;
  const dy = (e.clientY - dragStart.y)/cam.zoom;
  cam.x = camStart.x - dx;
  cam.y = camStart.y - dy;
});
window.addEventListener('mouseup', () => { dragging = false; });

// Zoom
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? .9 : 1.1;
  cam.zoom = Math.max(.15, Math.min(5, cam.zoom * factor));
}, {passive:false});

// Touch support
let touches = [], lastPinchDist = 0;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  touches = [...e.touches];
  if(touches.length === 1){
    const n = getNodeAt(touches[0].clientX, touches[0].clientY);
    if(n){
      if(focused === n) focused = null; else focused = n;
      showTooltip(n, touches[0].clientX, touches[0].clientY);
    } else {
      focused = null; hideTooltip();
      dragging = true;
      dragStart = {x:touches[0].clientX, y:touches[0].clientY};
      camStart = {x:cam.x, y:cam.y};
    }
  }
  if(touches.length === 2){
    dragging = false;
    const dx = touches[1].clientX - touches[0].clientX;
    const dy = touches[1].clientY - touches[0].clientY;
    lastPinchDist = Math.sqrt(dx*dx+dy*dy);
  }
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  touches = [...e.touches];
  if(touches.length === 1 && dragging){
    const dx = (touches[0].clientX - dragStart.x)/cam.zoom;
    const dy = (touches[0].clientY - dragStart.y)/cam.zoom;
    cam.x = camStart.x - dx;
    cam.y = camStart.y - dy;
  }
  if(touches.length === 2){
    const dx = touches[1].clientX - touches[0].clientX;
    const dy = touches[1].clientY - touches[0].clientY;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if(lastPinchDist){
      const factor = dist/lastPinchDist;
      cam.zoom = Math.max(.15, Math.min(5, cam.zoom * factor));
    }
    lastPinchDist = dist;
  }
}, {passive:false});
canvas.addEventListener('touchend', e => {
  dragging = false; lastPinchDist = 0;
  if(e.touches.length === 0) touches = [];
});

// ══════════════════════════════════════════════
// LEGEND
// ══════════════════════════════════════════════

const legendEl = document.getElementById('legend');
Object.entries(TYPES).forEach(([key, t]) => {
  const count = nodes.filter(n=>n.type===key).length;
  const item = document.createElement('div');
  item.className = 'leg-item';
  item.innerHTML = `<div class="leg-dot" style="background:${t.color}"></div>${t.label} (${count})`;
  item.addEventListener('click', () => {
    if(activeTypes.has(key)){
      activeTypes.delete(key);
      item.classList.add('muted');
    } else {
      activeTypes.add(key);
      item.classList.remove('muted');
    }
  });
  legendEl.appendChild(item);
});

// SEARCH
// ══════════════════════════════════════════════

const searchInput = document.getElementById('search');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  if(!q){ focused = null; return; }
  const match = nodes.find(n => n.name.toLowerCase().includes(q));
  if(match){
    focused = match;
    cam.x = match.x; cam.y = match.y;
    cam.zoom = 1.5;
  }
});

// Prevent canvas interaction when typing
searchInput.addEventListener('keydown', e => e.stopPropagation());

})();
